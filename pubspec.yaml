name: everafter
description: "Mobile-first photo and video galleries for NFC travel magnets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Gallery layouts
    - assets/data/gallery_layouts.json
    - assets/data/photo_dimensions.json

    # Personal trip photos and videos
    - assets/memories/spain-2026/
    - assets/memories/paris-2026/
    - assets/memories/georgia-aquarium-2026/
    - assets/memories/philippines-2025/
    - assets/memories/washington-2022/
    - assets/memories/new-york-2024/
    - assets/memories/carnival-2024/
    - assets/memories/royal-caribbean-2024/
    - assets/memories/epic-universal-2025/
    - assets/memories/norwegian-2025/
    - assets/memories/royal-caribbean-2026/
    - assets/memories/universal-2026/

    # Gallery frames and decorations
    - assets/images/experience/baroque-frame-circular-hd.png
    - assets/images/experience/baroque-frame-horizontal-oval-hd.png
    - assets/images/experience/baroque-frame-landscape-hd.png
    - assets/images/experience/baroque-frame-oval-hd.png
    - assets/images/experience/baroque-frame-portrait-hd.png
    - assets/images/experience/china-nfc-magnet-reveal.png
    - assets/images/experience/hong-kong-nfc-magnet-reveal.png
    - assets/images/experience/japan-nfc-magnet-reveal-fox.png
    - assets/images/experience/taiwan-nfc-magnet-reveal-bubble-tea.png
    - assets/images/experience/vietnam-nfc-magnet-reveal-lotus.png
    - assets/images/experience/earth-globe-fallback.png
    - assets/images/experience/museum-spotlight-overlay.png

    # Gallery wall textures
    - assets/textures/texturelabs_paper_320.jpg
    - assets/textures/warm_linen_canvas_fine.jpg
    - assets/textures/warm_linen_canvas_visible.jpg
    - assets/textures/red_damask_gallery_wall.jpeg

    # Asset licenses
    - assets/licenses/erratic_cursive_cc0.txt
    - assets/licenses/erratic_cursive_eula.txt
    - assets/licenses/nasa_blue_marble.txt
    - assets/licenses/roboto_apache_2.txt
    - assets/licenses/noto_sans_symbols_ofl.txt

  fonts:
    - family: ErraticCursive
      fonts:
        - asset: assets/fonts/erratic_cursive_regular.otf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
